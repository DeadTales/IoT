; Configuración de compilación, bibliotecas y diagnóstico de la TFT.

[platformio]
default_envs = esp32-s3-devkitc-1

; Firmware principal para la placa ESP32-S3.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<main.cpp> +<csv_http_upload.cpp>

; La TFT usa el bus HSPI y los pines definidos en el archivo de configuración.
build_flags =
    -D USE_HSPI_PORT
    -D USER_SETUP_LOADED
    -include include/TFT_Setup.h

; Control de pantalla, serialización de lecturas, MQTT y sensor DHT.
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.2.2
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6

; Diagnóstico aislado de pantalla con los mismos pines y bus SPI.
[env:display-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<display_test.cpp>

; Diagnóstico alternativo con bus FSPI y reloj reducido a 5 MHz.
[env:display-test-fspi]
extends = env:display-test
build_flags =
    -D USE_FSPI_PORT
    -D USER_SETUP_LOADED
    -D SPI_FREQUENCY=5000000
    -include include/TFT_Setup.h
