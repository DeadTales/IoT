; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_src_filter = +<main.cpp>
build_flags = 
	-D USE_HSPI_PORT
	-D USER_SETUP_LOADED
	-include include/TFT_Setup.h
lib_deps = 
	bodmer/TFT_eSPI@^2.5.43
	bblanchon/ArduinoJson@^7.2.2
	knolleary/PubSubClient@^2.8
	adafruit/DHT sensor library@^1.4.6

; Diagnostico aislado de pantalla, con los mismos pines y bus SPI.
[env:display-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<display_test.cpp>

; Variante de diagnostico: bus FSPI explicito y reloj reducido a 5 MHz.
[env:display-test-fspi]
extends = env:display-test
build_flags =
    -D USE_FSPI_PORT
    -D USER_SETUP_LOADED
    -D SPI_FREQUENCY=5000000
    -include include/TFT_Setup.h
